<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Petualangan Mencari Harta Pengetahuan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg-deep:#0c2b2a;
  --bg-deep2:#153b34;
  --forest:#1f5c4a;
  --forest-light:#2f7d5e;
  --gold:#e0ac4f;
  --gold-bright:#ffce6b;
  --parchment:#f6efdc;
  --parchment-dark:#e6d9b8;
  --ink:#2c2013;
  --mystic:#7a5cc0;
  --mystic-dark:#4d3980;
  --danger:#c1483c;
  --ok:#3f9d6b;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{margin:0;padding:0;height:100%;}
:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px;}
body{
  font-family:'Nunito',sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(224,172,79,.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(122,92,192,.14), transparent 45%),
    linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep2) 55%, #0a2320 100%);
  color:var(--parchment);
  min-height:100vh;
  overflow-x:hidden;
}
#app{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,.display{font-family:'Cinzel',serif;letter-spacing:.02em;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;}
::selection{background:var(--gold);color:var(--ink);}

/* ---------- layout helpers ---------- */
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;min-height:100vh;position:relative;}
.wrap{width:100%;max-width:920px;margin:0 auto;}
.card{
  background:linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  color:var(--ink);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:28px;
  position:relative;
  border:3px solid rgba(224,172,79,.55);
}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  padding:clamp(12px,2.5vw,14px) clamp(18px,4vw,26px);border-radius:14px;font-weight:800;
  font-size:clamp(14px,3vw,16px);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s;
  min-height:48px;max-width:100%;
}
.btn:active{transform:scale(.96);}
.btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:var(--ink);box-shadow:0 6px 0 #a97a28, 0 10px 18px rgba(0,0,0,.35);}
.btn-gold:hover{filter:brightness(1.06);}
.btn-forest{background:linear-gradient(180deg,var(--forest-light),var(--forest));color:#eafff2;box-shadow:0 6px 0 #123b2d,0 10px 18px rgba(0,0,0,.3);}
.btn-mystic{background:linear-gradient(180deg,#9a7bde,var(--mystic));color:#fff;box-shadow:0 6px 0 #33265c,0 10px 18px rgba(0,0,0,.3);}
.btn-outline{background:transparent;border:2px solid var(--parchment-dark);color:var(--parchment);box-shadow:none;}
.btn-outline:hover{background:rgba(255,255,255,.08);}
.btn-danger{background:linear-gradient(180deg,#e0685a,var(--danger));color:#fff;box-shadow:0 6px 0 #7c2c22;}
.btn-sm{padding:9px 14px;font-size:13px;min-height:40px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3);box-shadow:none;transform:none;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.center{text-align:center;}
.spacer{flex:1;}
input[type=text],input[type=number],textarea,select{
  font-family:'Nunito',sans-serif;padding:12px 14px;border-radius:10px;border:2px solid var(--parchment-dark);
  background:#fffdf6;color:var(--ink);font-size:15px;width:100%;
}
textarea{resize:vertical;min-height:120px;}
label.field-label{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#5c4a2c;margin-bottom:6px;display:block;}

/* ---------- top bar (in-game) ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px;
  padding:10px 16px;background:rgba(10,30,28,.85);backdrop-filter:blur(6px);
  border-bottom:2px solid rgba(224,172,79,.35);width:100%;max-width:100vw;
}
.topbar .chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:999px;font-weight:800;font-size:clamp(12px,2.6vw,14px);white-space:nowrap;}
.hearts{letter-spacing:2px;}
.topbar .name{font-weight:800;color:var(--gold-bright);}

/* ---------- splash ---------- */
.splash-title{font-size:clamp(30px,6vw,54px);text-align:center;color:var(--gold-bright);text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 40px rgba(224,172,79,.35);margin:0 0 6px;}
.splash-sub{text-align:center;color:var(--parchment-dark);font-size:clamp(14px,2.2vw,18px);margin-bottom:34px;max-width:640px;}
.emoji-row{font-size:38px;text-align:center;margin-bottom:18px;letter-spacing:6px;animation:float 3.5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.compass{width:120px;height:120px;margin:0 auto 20px;animation:spin 12s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- map ---------- */
.map-title{color:var(--gold-bright);text-align:center;margin:6px 0 4px;}
.map-story{color:var(--parchment-dark);text-align:center;max-width:680px;margin:0 auto 18px;font-size:14px;line-height:1.6;}
.path-svg{width:100%;max-width:760px;display:block;margin:0 auto;}
.map-scroll{overflow-x:hidden;padding:10px 6px 40px;}
.node{cursor:pointer;transition:transform .15s;}
.node:hover{transform:scale(1.06);}
.node.locked{cursor:not-allowed;}
.node-label{font-family:'Cinzel',serif;font-weight:700;fill:var(--parchment);}

/* ---------- level scene ---------- */
.scene{width:100%;max-width:820px;margin:0 auto;padding:18px 14px 60px;}
.scene-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.scene-header .lvl-badge{font-size:34px;}
.progress-track{height:14px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;border:2px solid rgba(224,172,79,.4);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .35s ease;}
.qcard{margin-top:16px;}
.opt-btn{
  display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:12px;border-radius:14px;min-height:48px;
  background:#fffdf6;border:2.5px solid var(--parchment-dark);color:var(--ink);font-weight:700;font-size:clamp(14px,3vw,15px);
  transition:all .15s;word-break:break-word;
}
.opt-btn:hover{border-color:var(--gold);background:#fff8e8;}
.opt-btn.correct{background:#defbe8;border-color:var(--ok);color:#175c37;}
.opt-btn.wrong{background:#fde3e0;border-color:var(--danger);color:#7c2c22;}
.opt-btn.dim{opacity:.55;}
.sentence-opt{display:block;padding:12px 14px;margin-bottom:8px;border-radius:10px;background:#fffdf6;border:2px solid var(--parchment-dark);cursor:pointer;line-height:1.5;}
.sentence-opt:hover{border-color:var(--gold);}
.tile{display:inline-flex;padding:10px 16px;margin:4px;border-radius:10px;background:var(--gold);color:var(--ink);font-weight:800;cursor:pointer;box-shadow:0 4px 0 #a97a28;}
.tile.used{opacity:.3;pointer-events:none;}
.build-zone{min-height:56px;border:2px dashed var(--parchment-dark);border-radius:12px;padding:10px;margin:12px 0;background:rgba(255,255,255,.5);}
.match-col{display:flex;flex-direction:column;gap:10px;}
.match-item{padding:12px 14px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#fffdf6;border:2.5px solid var(--parchment-dark);cursor:pointer;font-weight:700;text-align:center;}
.match-item.selected{border-color:var(--mystic);background:#efe7ff;}
.match-item.paired{border-color:var(--ok);background:#defbe8;opacity:.85;cursor:default;}
.match-item.shake{animation:shake .3s;border-color:var(--danger)!important;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tf-btns{display:flex;gap:16px;margin-top:10px;}
.tf-btns .btn{flex:1;font-size:20px;}
.hint-box{margin-top:14px;background:#fff3d6;border:2px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px;color:#5c4207;}
.feedback{margin-top:14px;padding:14px 16px;border-radius:12px;font-weight:700;}
.feedback.ok{background:#defbe8;color:#175c37;border:2px solid var(--ok);}
.feedback.bad{background:#fde3e0;color:#7c2c22;border:2px solid var(--danger);}
.timer-pill{font-family:'JetBrains Mono',monospace;font-weight:700;background:rgba(0,0,0,.25);padding:6px 12px;border-radius:999px;}
.timer-pill.low{background:var(--danger);color:#fff;animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.6}}
.maze-track{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:14px 6px;background:rgba(0,0,0,.2);border-radius:14px;margin-bottom:14px;}
.gate{min-width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;}
.gate.done{background:var(--ok);}
.gate.current{background:var(--gold);box-shadow:0 0 0 4px rgba(224,172,79,.35);}
.gate.checkpoint::after{content:'🚩';position:absolute;top:-20px;font-size:14px;}
.evidence-box{background:#fff8e8;border:2px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.6;}
.evidence-box ul{margin:6px 0 0 18px;padding:0;}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,20,18,.78);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:linear-gradient(180deg,var(--parchment),var(--parchment-dark));color:var(--ink);border-radius:22px;padding:32px 26px;max-width:440px;width:100%;text-align:center;box-shadow:var(--shadow);border:3px solid var(--gold);animation:pop .35s ease;}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.key-glow{font-size:60px;filter:drop-shadow(0 0 18px var(--gold));animation:keyspin .9s ease;}
@keyframes keyspin{0%{transform:rotate(-20deg) scale(.5);opacity:0}60%{transform:rotate(10deg) scale(1.15)}100%{transform:rotate(0) scale(1);opacity:1}}

/* ---------- toast notifikasi ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:linear-gradient(180deg,var(--forest-light),var(--forest));color:#eafff2;padding:13px 22px;border-radius:14px;font-weight:800;box-shadow:0 10px 26px rgba(0,0,0,.4);z-index:300;opacity:0;transition:opacity .25s ease, transform .25s ease;display:flex;align-items:center;gap:8px;max-width:92vw;text-align:center;font-size:14px;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:linear-gradient(180deg,#e0685a,var(--danger));}

/* ---------- sertifikat ---------- */
.cert-modal{max-width:700px;background:#fffdf6;color:var(--ink);border:none;padding:0;box-shadow:0 25px 70px rgba(0,0,0,.5);}
.cert-border{border:10px solid var(--gold);outline:2px solid var(--gold-bright);outline-offset:-18px;padding:clamp(22px,5vw,44px) clamp(18px,5vw,34px);text-align:center;background:linear-gradient(160deg,#fffdf6,#fbf1d8);}
.cert-ornament{font-size:42px;margin-bottom:4px;}
.cert-title{font-family:'Cinzel',serif;font-size:clamp(20px,4.2vw,30px);letter-spacing:.08em;color:#8a6a1f;margin:0 0 8px;}
.cert-sub{font-size:13px;color:#5c4a2c;margin:0;text-transform:uppercase;letter-spacing:.06em;}
.cert-name{font-family:'Cinzel',serif;font-size:clamp(24px,5.5vw,36px);color:var(--ink);margin:10px 0;border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:6px;word-break:break-word;}
.cert-kelas{margin:0 0 12px;color:#5c4a2c;font-weight:700;font-size:13px;}
.cert-body{font-size:14px;line-height:1.7;margin:14px auto 22px;max-width:520px;}
.cert-stats{display:flex;justify-content:center;gap:clamp(14px,4vw,34px);flex-wrap:wrap;margin-bottom:26px;}
.cert-stats div{font-size:13px;color:#5c4a2c;}
.cert-stats b{font-size:20px;color:#8a6a1f;display:block;font-family:'Cinzel',serif;}
.cert-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;flex-wrap:wrap;gap:16px;text-align:left;}
.cert-date{font-size:12px;color:#5c4a2c;align-self:flex-end;}
.cert-sign{text-align:center;}
.cert-sign-line{font-family:'Cinzel',serif;font-weight:700;border-top:2px solid var(--ink);padding-top:6px;min-width:200px;font-size:14px;}
.cert-sign-role{font-size:11px;color:#5c4a2c;}
.cert-actions{padding:16px 18px;background:rgba(0,0,0,.04);}
@media print{
  body *{visibility:hidden;}
  #certPrintArea, #certPrintArea *{visibility:visible;}
  #certPrintArea{position:fixed;left:0;top:0;width:100%;margin:0;box-shadow:none;}
  .cert-actions{display:none!important;}
  .overlay{background:none!important;position:static!important;}
}

/* ---------- badges/achievements ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
.badge{background:#fffdf6;border:2.5px solid var(--parchment-dark);border-radius:14px;padding:16px 10px;text-align:center;}
.badge.locked{opacity:.35;filter:grayscale(1);}
.badge .ic{font-size:34px;}

/* ---------- teacher ---------- */
.teach-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.teach-tab{padding:10px 16px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--parchment);font-weight:700;}
.teach-tab.active{background:var(--gold);color:var(--ink);}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--parchment-dark);text-align:left;}
table.data th{color:#5c4a2c;text-transform:uppercase;font-size:11px;letter-spacing:.05em;}
.qedit-item{border:2px solid var(--parchment-dark);border-radius:12px;padding:12px;margin-bottom:10px;background:#fffdf6;}
.small-muted{color:#5c4a2c;font-size:12px;opacity:.8;}
.toggle{display:inline-flex;align-items:center;gap:8px;}
.switch{width:46px;height:26px;border-radius:999px;background:#bbb;position:relative;transition:.2s;}
.switch.on{background:var(--ok);}
.switch::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;}
.switch.on::after{left:23px;}

/* ---------- responsivitas: HP, tablet, laptop, TV interaktif ---------- */
@media (max-width:640px){
  .card{padding:18px;}
  .scene-header{gap:8px;}
  .screen{padding:16px 10px;}
  .tf-btns .btn{font-size:17px;}
}
@media (max-width:380px){
  .card{padding:14px;}
  .topbar{padding:8px 10px;gap:8px;}
  .topbar .chip{padding:5px 9px;}
  .btn-sm{padding:7px 10px;font-size:12px;}
  .modal{padding:24px 18px;}
}
/* layar pendek / orientasi landscape di HP: kurangi padding vertikal supaya konten tidak terpotong */
@media (max-height:480px) and (orientation:landscape){
  .screen{padding:10px 16px;min-height:auto;}
  .scene{padding:10px 14px 30px;}
  .card{padding:16px;}
  .emoji-row{margin-bottom:8px;}
  .splash-sub{margin-bottom:14px;}
}
/* tablet */
@media (min-width:641px) and (max-width:1024px){
  .wrap,.scene{max-width:88vw;}
}
/* layar besar / TV interaktif: perbesar elemen agar tetap nyaman dilihat & disentuh dari jarak jauh */
@media (min-width:1400px){
  .wrap,.scene{max-width:1100px;}
}
@media (min-width:1800px){
  body{font-size:19px;}
  .btn{min-height:60px;font-size:19px;padding:16px 32px;}
  .opt-btn{padding:20px 22px;font-size:19px;}
  .topbar .chip{font-size:18px;padding:10px 18px;}
}
/* pastikan tidak ada elemen yang keluar dari layar pada ukuran manapun */
img,svg{max-width:100%;height:auto;}
</style>

<body>
<div id="app"><div class="screen"><div class="center">Memuat petualangan…</div></div></div>

<script>
/* ======================================================================
   PETUALANGAN MENCARI HARTA PENGETAHUAN
   Single-file educational adventure game.
   ====================================================================== */

/* ---------------- storage helpers ----------------------------------------
   Prioritas: window.storage (tersedia saat game dijalankan di dalam Claude,
   progres tersimpan ke akun & tersinkron lintas perangkat).
   Fallback : localStorage (dipakai otomatis saat file .html ini diunduh dan
   dibuka langsung di browser / offline, tempat window.storage tidak ada).
   Fallback hanya menyimpan di browser/perangkat itu saja. --------------- */
function hasCloudStorage(){
  return typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function';
}
function lsKey(key, shared){ return 'phpgame:'+(shared?'shared:':'local:')+key; }
async function sGet(key, shared=false){
  if(hasCloudStorage()){
    try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
    catch(e){ /* lanjut ke fallback di bawah */ }
  }
  try{ const raw = localStorage.getItem(lsKey(key, shared)); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared=false){
  if(hasCloudStorage()){
    try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
    catch(e){ /* lanjut ke fallback di bawah */ }
  }
  try{ localStorage.setItem(lsKey(key, shared), JSON.stringify(value)); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function sList(prefix, shared=false){
  if(hasCloudStorage()){
    try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }
    catch(e){ /* lanjut ke fallback di bawah */ }
  }
  try{
    const nsPrefix = lsKey(prefix, shared);
    const nsRoot = lsKey('', shared);
    const out = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(nsPrefix)===0) out.push(k.slice(nsRoot.length));
    }
    return out;
  }catch(e){ return []; }
}

/* ---------------- default content (contoh materi & soal) -------------- */
const DEFAULT_MATERI = {
  judul: "Perancangan dan Produksi Kerajinan dengan Inspirasi Objek Budaya Lokal",
  isi: `Perancangan dan produksi didasari oleh data yang telah diperoleh melalui Tugas 1 tentang Ragam Objek Budaya Lokal dan Tugas 2 tentang Identifikasi Ragam Material dan Teknik produksi di lingkungan sekitar. Objek budaya lokal dan material serta teknik khas daerah merupakan potensi yang harus dikembangkan sehingga lestari dan menjadi manfaat bagi daerah. Proses perancangan kerajinan diawali dengan pemilihan sumber inspirasi dan pencarian ide produk kerajinan, pembuatan sketsa ide, pembuatan studi model kerajinan, dilanjutkan dengan pembuatan petunjuk produksi. Objek budaya lokal dapat berupa objek dua dimensi seperti relief dan motif, atau tiga dimensi seperti bangunan, alat musik, dan senjata.

1. Pencarian Ide Produk: Ide dapat muncul secara tidak berurutan maupun utuh. Untuk memudahkan pencarian ide, pikirkan: objek budaya lokal apa yang menjadi inspirasi, produk apa yang dibuat, siapa penggunanya, bahan apa yang dipakai, warna/motif apa, teknik apa, proses dan alat apa. Pertanyaan tersebut didiskusikan lewat brainstorming, di mana setiap anggota bebas mengeluarkan ide sebanyak-banyaknya tanpa takut salah.

2. Membuat Gambar/Sketsa: Ide digambarkan agar yang abstrak menjadi berwujud, sebaiknya menggunakan pensil/spidol/bolpoin dan menghindari penghapus, menarik garis tipis dahulu lalu menegaskannya.

3. Pilih Ide Terbaik: Setelah banyak sketsa dibuat, dipertimbangkan ide mana yang paling baik, menyenangkan, dan memungkinkan untuk dibuat.

4. Prototyping / Studi Model: Sketsa dua dimensi perlu diuji dalam format tiga dimensi melalui studi model, yang dapat memakai material sebenarnya atau bukan.

5. Perencanaan Produksi: Tahap membuat rencana proses produksi, dengan prosedur dan langkah kerja yang jelas dan detail agar produksi mudah dan terencana.`
};

// Question schema by type:
// mc: {q, options:[..4], answer:idx, hint}
// sentence: {paragraph, q, sentences:[..], answer:idx, hint}
// riddle: {clues:[..], options:[..4], answer:idx, hint}
// scramble: {words:[..scrambled], correct:[..in order], hint}
// matching: {pairs:[{term,def}], hint}
// tf: {statement, answer:bool, hint}
// maze: {gates:[ {q,options,answer} ], hint}
// detective: {evidence:[..], q, options, answer, hint}
// boss: {parts:[ {type:'mc'|'tf'|'riddle', ...} ]}

function defaultLevels(){
return [
 {id:1,name:"Kamp Awal",icon:"🏕️",type:"mc",diff:"Mudah",time:25,pass:0.6,

async function saveProgress(){ return await sSet('progress', S, false); }
async function saveContent(){ await sSet('content', C, true); }

/* ---------------- toast notifikasi ---------------- */
let toastTimer=null;
function showToast(msg, type){
  let t = document.getElementById('appToast');
  if(!t){ t=document.createElement('div'); t.id='appToast'; document.body.appendChild(t); }
  t.className = 'toast'+(type==='err'?' err':'');
  t.textContent = (type==='err'?'⚠️ ':'✅ ')+msg;
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 2600);
}

/* ---------------- audio (WebAudio synth, no files needed) ------------- */
let actx=null;
function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
function beep(freq=440,dur=.12,type='sine',vol=.18,delay=0){
  if(!S || !S.audio) return;
  const ctx=ac(); if(!ctx) return;
  const t=ctx.currentTime+delay;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur);
}
const SFX = {
  click:()=>beep(520,.06,'square',.12),
  correct:()=>{beep(660,.09,'sine',.18);beep(880,.12,'sine',.16,.09);},
  wrong:()=>{beep(180,.18,'sawtooth',.16);},
  key:()=>{beep(523,.12,'sine',.2);beep(659,.12,'sine',.2,.12);beep(784,.18,'sine',.22,.24);},
  levelup:()=>{beep(440,.1,'triangle',.2);beep(554,.1,'triangle',.2,.1);beep(659,.16,'triangle',.22,.2);},
  win:()=>{[523,659,784,1046].forEach((f,i)=>beep(f,.18,'triangle',.22,i*.14));},
  lose:()=>{beep(300,.2,'sawtooth',.18);beep(220,.25,'sawtooth',.16,.15);}
};

/* ---------------- small utils ---------------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function on(id,ev,fn){ const el=document.getElementById(id); if(el) el.addEventListener(ev,fn); }
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,'0'); }

function render(){
  switch(UI.screen){
    case "loading": app.innerHTML = `<div class="screen"><div class="center">Memuat…</div></div>`; break;
    case "splash": renderSplash(); break;
    case "name": renderNameInput(); break;
    case "map": renderMap(); break;

    case "result": renderFinalResult(); break;
    case "achievements": renderAchievements(); break;
    case "teacher": renderTeacher(); break;
    case "settings": renderSettings(); break;
    default: renderSplash();
  }
}

/* ================= MAP ================= */
function levelState(lv){
  if(S.completed.includes(lv.id)) return "done";
  if(lv.id === S.unlockedLevel || S.completed.includes(lv.id-1) || lv.id===1) {
    if(lv.id <= S.unlockedLevel) return "open";
  }
  return "locked";
}

function renderMap(){
  const levels = C.levels;
  const totalDone = S.completed.length;
  const pct = Math.round((totalDone/10)*100);
  let nodesHtml = levels.map((lv,i)=>{
    const st = levelState(lv);
    const icon = st==='done' ? '✅' : st==='open' ? lv.icon : '🔒';
    const cls = st==='locked' ? 'locked' : '';
    return `
    <div class="node ${cls}" data-lv="${lv.id}" tabindex="0" role="button" aria-label="Level ${lv.id} ${esc(lv.name)}" style="display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;border-radius:16px;background:${st==='locked'?'rgba(255,255,255,.05)':'rgba(255,255,255,.10)'};border:2px solid ${st==='done'?'var(--ok)':st==='open'?'var(--gold)':'rgba(255,255,255,.15)'};">
    
      <div style="font-size:30px;">${icon}</div>

      <div class="progress-track" style="margin-bottom:6px;"><div class="progress-fill" style="width:${pct}%"></div></div>

/* ================= LEVEL RUNTIME ================= */
function startLevel(id){
  const lv = C.levels.find(l=>l.id===id);
  RUN = {
    lvId:id, level:lv, idx:0, correct:0, total:0, usedHint:false,
    timeLeft: lv.time, timerHandle:null, lives: lv.lives||3, maxLives: lv.lives||3,
    mazeGateIdx:0, mazeCheckpoint:0, matchState:null, scrambleState:null,
    bossPartIdx:0
  };
  if(lv.type==='matching') RUN.total = lv.questions[0].pairs.length;
  else if(lv.type==='maze') RUN.total = lv.questions.gates.length;
  else if(lv.type==='boss') RUN.total = lv.questions.parts.length;
  else RUN.total = lv.questions.length;
  UI.screen='level';
  render();
  startTimer();
}

function startTimer(){
  // Tidak ada batas waktu dalam menjawab — pemain bisa berpikir dengan tenang.
}
function stopTimer(){ if(RUN&&RUN.timerHandle) clearInterval(RUN.timerHandle); }

function handleLevelTimeout(){
  SFX.wrong();
  finishLevel(false);
}

function scoreAdd(n){ S.score = Math.max(0, S.score+n); }

/* ---- nyawa (lives) helpers: shared oleh semua tipe soal ---- */
function heartsHtml(){
  const max = (RUN && RUN.maxLives) || 3;
  const lv = RUN ? Math.max(0,RUN.lives) : max;
  return "❤️".repeat(lv) + "🖤".repeat(Math.max(0,max-lv));
}
function updateTopChips(){
  document.querySelectorAll('.topbar .chip').forEach(c=>{
    if(c.textContent.includes('❤️')||c.textContent.includes('🖤')) c.innerHTML = heartsHtml();
    else if(c.classList.contains('mono') && c.textContent.trim().startsWith('⭐')) c.textContent = '⭐ '+S.score;
  });
}
function resetLevelAttempt(){
  RUN.idx = 0; RUN.correct = 0; RUN.lives = RUN.maxLives; RUN.usedHint = false;
  RUN.mazeGateIdx = 0; RUN.mazeCheckpoint = 0;
  RUN.matchState = null; RUN.scrambleState = null; RUN.riddleClueIdx = 1; RUN.bossPartIdx = 0;
}
function handleLivesExhausted(){
  stopTimer();
  const penalty = Math.min(80, S.score);
  S.score = Math.max(0, S.score - penalty);
  saveProgress();
  showLoseLifeModal(penalty);
}
function showLoseLifeModal(penalty){
  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="modal">
    <div style="font-size:50px;">💔</div>
    <h2>NYAWA HABIS!</h2>
    <p>Kamu harus mengulang level ini dari soal pertama.${penalty>0?` Poin dikurangi <b>${penalty}</b> sebagai penalti.`:''}</p>
    <div class="row" style="justify-content:center;margin-top:14px;">
      <button class="btn btn-gold" id="retryLife">🔁 Mulai Ulang dari Soal 1</button>
      <button class="btn btn-outline" id="toMapLife">🗺️ Kembali ke Peta</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#retryLife').onclick = ()=>{
    document.body.removeChild(ov);
    resetLevelAttempt();
    render();
    startTimer();
  };
  ov.querySelector('#toMapLife').onclick = ()=>{ document.body.removeChild(ov); UI.screen='map'; render(); };
}

function renderLevelScene(){
  const lv = RUN.level;
  const pct = Math.round((RUN.idx/RUN.total)*100);
  app.innerHTML = `
  <div class="topbar">
    <button class="btn btn-outline btn-sm" id="backMap">← Peta</button>
    <div class="chip">${heartsHtml()}</div>
    <div class="chip mono">⭐ ${S.score}</div>
    <div class="spacer"></div>
    <button class="btn btn-forest btn-sm" id="saveBtnLvl">💾</button>
    <button class="btn btn-outline btn-sm" id="hintBtn">💡 Petunjuk</button>
    <button class="btn btn-outline btn-sm" id="audioBtn">${S.audio?'🔊':'🔇'}</button>
  </div>
  <div class="scene">
    <div class="scene-header">
      <div class="lvl-badge">${lv.icon}</div>
      <div>
        <h2 style="margin:0;color:var(--gold-bright);">Level ${lv.id} — ${esc(lv.name)}</h2>
        <div class="small-muted" style="color:var(--parchment-dark);">${esc(lv.diff)}</div>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div id="qcard" class="card qcard"></div>
    <div id="hintSlot"></div>
  </div>`;
  on('backMap','click',()=>{ if(confirm('Keluar dari level? Progress level ini akan hilang.')){ stopTimer(); UI.screen='map'; render(); }});
  on('saveBtnLvl','click', async ()=>{ SFX.click(); await manualSave(); });
  on('audioBtn','click',()=>{ S.audio=!S.audio; saveProgress(); render(); });
  on('hintBtn','click',()=>useHint());
  renderQuestionByType();
}

function useHint(){
  RUN.usedHint = true;
  let text = "Tidak ada petunjuk tambahan untuk soal ini.";
  const lv = RUN.level;
  if(lv.type==='mc'||lv.type==='sentence'||lv.type==='riddle'||lv.type==='scramble'||lv.type==='matching'||lv.type==='tf'||lv.type==='detective'){
    const q = lv.type==='matching' ? lv.questions[0] : lv.questions[RUN.idx];
    if(q && q.hint) text = q.hint;
  } else if(lv.type==='maze'){
    text = lv.questions.hint || text;
  } else if(lv.type==='boss'){
    text = "Ingat kembali seluruh materi yang sudah kamu pelajari di level-level sebelumnya!";
  }
  scoreAdd(-10);
  const slot = document.getElementById('hintSlot');
  if(slot) slot.innerHTML = `<div class="hint-box">💡 <b>Petunjuk:</b> ${esc(text)}</div>`;
  updateTopChips();
}

function renderQuestionByType(){
  const lv = RUN.level;
  document.getElementById('hintSlot') && (document.getElementById('hintSlot').innerHTML='');
  if(lv.type==='mc') return renderMC();
  if(lv.type==='sentence') return renderSentence();
  if(lv.type==='riddle') return renderRiddle();
  if(lv.type==='scramble') return renderScramble();
  if(lv.type==='matching') return renderMatching();
  if(lv.type==='tf') return renderTF();
  if(lv.type==='maze') return renderMaze();
  if(lv.type==='detective') return renderDetective();
  if(lv.type==='boss') return renderBossPart();
}

function feedbackThenNext(isCorrect, correctText, cb){
  const qcard = document.getElementById('qcard');
  const fb = document.createElement('div');
  fb.className = 'feedback ' + (isCorrect?'ok':'bad');
  fb.innerHTML = isCorrect ? `✅ <b>HEBAT!</b> Jawabanmu benar. +100 poin` : `❌ Jawaban belum tepat. Nyawa berkurang 1. Coba lagi soal ini!`;
  qcard.appendChild(fb);
  if(isCorrect){ SFX.correct(); scoreAdd(100); RUN.correct++; }
  else { SFX.wrong(); RUN.lives--; }
  updateTopChips();
  setTimeout(()=>{
    if(!isCorrect){
      if(RUN.lives<=0){ handleLivesExhausted(); return; }
      // Jawaban salah tapi nyawa masih ada: ulangi soal yang sama sampai benar.
      render();
      return;
    }
    RUN.idx++;
    if(RUN.idx>=RUN.total){ stopTimer(); finishLevel(true); }
    else render();
  }, 1200);
}

/* ---- MC ---- */
function renderMC(){
  const q = RUN.level.questions[RUN.idx];
  const qcard = document.getElementById('qcard');
  qcard.innerHTML = `<h3>${esc(q.q)}</h3><div id="opts"></div>`;
  const optsEl = document.getElementById('opts');
  q.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='opt-btn'; b.textContent = opt;
    b.onclick = ()=>{
      document.querySelectorAll('#opts .opt-btn').forEach(x=>x.classList.add('dim'));
      b.classList.remove('dim');
      b.classList.add(i===q.answer?'correct':'wrong');
      feedbackThenNext(i===q.answer, q.options[q.answer]);
    };
    optsEl.appendChild(b);
  });
}

function renderSentence(){

/* ---- RIDDLE ---- */
function renderRiddle(){
  const q = RUN.level.questions[RUN.idx];
  if(!RUN.riddleClueIdx) RUN.riddleClueIdx = 1;
  const qcard = document.getElementById('qcard');
  const clues = q.clues.slice(0, RUN.riddleClueIdx);
  qcard.innerHTML = `
   <h3>🧩 Siapakah Aku?</h3>
   <div class="evidence-box"><ul>${clues.map(c=>'<li>'+esc(c)+'</li>').join('')}</ul></div>
   ${RUN.riddleClueIdx < q.clues.length ? `<button class="btn btn-outline btn-sm" id="moreClue">➕ Petunjuk Berikutnya</button>` : ''}
   <div id="opts" style="margin-top:14px;"></div>`;
  on('moreClue','click',()=>{ RUN.riddleClueIdx++; renderRiddle(); });
  const optsEl = document.getElementById('opts');
  q.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='opt-btn'; b.textContent = opt;
    b.onclick = ()=>{
      document.querySelectorAll('#opts .opt-btn').forEach(x=>x.classList.add('dim'));
      b.classList.remove('dim'); b.classList.add(i===q.answer?'correct':'wrong');
      RUN.riddleClueIdx = 1;
      feedbackThenNext(i===q.answer, q.options[q.answer]);
    };
    optsEl.appendChild(b);
  });
}

/* ---- SCRAMBLE (click tiles in order, touch friendly) ---- */
function renderScramble(){
  const q = RUN.level.questions[RUN.idx];
  if(!RUN.scrambleState || RUN.scrambleState.qidx!==RUN.idx){
    RUN.scrambleState = { qidx:RUN.idx, pool: shuffle(q.words).map((w,i)=>({w,used:false,uid:i})), built:[] };
  }
  const st = RUN.scrambleState;
  const qcard = document.getElementById('qcard');
  qcard.innerHTML = `
   <h3>🧵 Susun kata menjadi kalimat yang benar!</h3>
   <div class="build-zone" id="buildZone">${st.built.map(b=>`<span class="tile">${esc(b.w)}</span>`).join(' ')}</div>
   <div id="pool"></div>
   <div class="row" style="margin-top:14px;">
     <button class="btn btn-outline btn-sm" id="resetBtn">↺ Ulangi Susunan</button>
     <button class="btn btn-gold btn-sm" id="submitScramble">✅ Periksa Jawaban</button>
   </div>`;
  const poolEl = document.getElementById('pool');
  st.pool.forEach(item=>{
    const b = document.createElement('button');
    b.className='tile'+(item.used?' used':''); b.textContent=item.w;
    b.onclick = ()=>{ if(item.used) return; item.used=true; st.built.push(item); SFX.click(); renderScramble(); };
    poolEl.appendChild(b);
  });
  on('resetBtn','click',()=>{ st.pool.forEach(p=>p.used=false); st.built=[]; renderScramble(); });
  on('submitScramble','click',()=>{
    const built = st.built.map(b=>b.w);
    const isCorrect = JSON.stringify(built) === JSON.stringify(q.correct);
    RUN.scrambleState = null;
    feedbackThenNext(isCorrect, q.correct.join(' '));
  });
}

/* ---- MATCHING (click term then def) ---- */
function renderMatching(){
  const q = RUN.level.questions[0];
  if(!RUN.matchState){
    RUN.matchState = {
      terms: shuffle(q.pairs.map((p,i)=>({...p,idx:i}))),
      defs: shuffle(q.pairs.map((p,i)=>({...p,idx:i}))),
      pairedIdx: new Set(), selTerm:null, selDef:null
    };
  }
  const st = RUN.matchState;
  const qcard = document.getElementById('qcard');
  qcard.innerHTML = `
   <h3>🔗 Pasangkan istilah dengan pengertiannya</h3>
   <div class="row" style="align-items:flex-start;">
    <div class="match-col" style="flex:1;" id="termCol"></div>
    <div class="match-col" style="flex:1;" id="defCol"></div>
   </div>
   <div class="small-muted" style="margin-top:10px;">Terpasang: ${st.pairedIdx.size}/${q.pairs.length}</div>`;
  const termCol = document.getElementById('termCol'), defCol = document.getElementById('defCol');
  st.terms.forEach(t=>{
    const el = document.createElement('div');
    const paired = st.pairedIdx.has(t.idx);
    el.className='match-item'+(paired?' paired':'')+(st.selTerm===t.idx&&!paired?' selected':'');
    el.textContent = t.term;
    if(!paired){
      el.tabIndex = 0; el.setAttribute('role','button');
      el.onclick = ()=>{ st.selTerm = t.idx; SFX.click(); const stop=tryMatch(); if(!stop) renderMatching(); };
      el.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.onclick(); } };
    }
    termCol.appendChild(el);
  });
  st.defs.forEach(d=>{
    const el = document.createElement('div');
    const paired = st.pairedIdx.has(d.idx);
    el.className='match-item'+(paired?' paired':'')+(st.selDef===d.idx&&!paired?' selected':'');
    el.textContent = d.def;
    if(!paired){
      el.tabIndex = 0; el.setAttribute('role','button');
      el.onclick = ()=>{ st.selDef = d.idx; SFX.click(); const stop=tryMatch(); if(!stop) renderMatching(); };
      el.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.onclick(); } };
    }
    defCol.appendChild(el);
  });
  function tryMatch(){
    if(st.selTerm!==null && st.selDef!==null){
      if(st.selTerm === st.selDef){
        st.pairedIdx.add(st.selTerm); SFX.correct(); scoreAdd(100); RUN.correct++;
        st.selTerm=null; st.selDef=null;
        updateTopChips();
        if(st.pairedIdx.size === q.pairs.length){
          RUN.idx = RUN.total;
          RUN.matchState=null;
          setTimeout(()=>{ stopTimer(); finishLevel(true); }, 500);
        }
      } else {
        SFX.wrong(); RUN.lives--;
        st.selTerm=null; st.selDef=null;
        updateTopChips();
        if(RUN.lives<=0){ handleLivesExhausted(); return true; }
      }
    }
    return false;
  }
}

/* ---- TRUE/FALSE ---- */
function renderTF(){
  const q = RUN.level.questions[RUN.idx];
  const qcard = document.getElementById('qcard');
  qcard.innerHTML = `<h3>${esc(q.statement)}</h3><div class="tf-btns"><button class="btn btn-forest" id="tTrue">✅ BENAR</button><button class="btn btn-danger" id="tFalse">❌ SALAH</button></div>`;
  on('tTrue','click',()=>{ document.getElementById('tTrue').disabled=true; document.getElementById('tFalse').disabled=true; feedbackThenNext(q.answer===true, q.answer?'BENAR':'SALAH'); });
  on('tFalse','click',()=>{ document.getElementById('tTrue').disabled=true; document.getElementById('tFalse').disabled=true; feedbackThenNext(q.answer===false, q.answer?'BENAR':'SALAH'); });
}

/* ---- MAZE ---- */
function renderMaze(){
  const gates = RUN.level.questions.gates;
  const gi = RUN.mazeGateIdx;
  const qcard = document.getElementById('qcard');
  let track = gates.map((g,i)=>{
    let cls='gate'; if(i<gi) cls+=' done'; if(i===gi) cls+=' current'; if(i%3===0) cls+=' checkpoint';
    return `<div class="${cls}">${i<gi?'✅':(i===gi?'🧑':'🔒')}</div>`;
  }).join('<div style="width:14px;height:2px;background:rgba(255,255,255,.25);"></div>');
  qcard.innerHTML = `
    <div class="maze-track">${track}</div>
    <h3>🌀 Gerbang ${gi+1} dari ${gates.length}</h3>
    <p>${esc(gates[gi].q)}</p>
    <div id="opts"></div>`;
  const optsEl = document.getElementById('opts');
  gates[gi].options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='opt-btn'; b.textContent = opt;
    b.onclick = ()=>{
      document.querySelectorAll('#opts .opt-btn').forEach(x=>x.classList.add('dim'));
      b.classList.remove('dim'); b.classList.add(i===gates[gi].answer?'correct':'wrong');
      const isCorrect = i===gates[gi].answer;
      const qcard2 = document.getElementById('qcard');
      const fb = document.createElement('div');
      if(isCorrect){
        SFX.correct(); scoreAdd(100); RUN.correct++;
        fb.className='feedback ok'; fb.innerHTML='✅ <b>HEBAT!</b> Gerbang terbuka! +100 poin';
      } else {
        SFX.wrong(); RUN.lives--;
        fb.className='feedback bad'; fb.innerHTML='❌ Jawaban salah! Nyawa berkurang. Kamu kembali ke checkpoint terakhir.';
      }
      updateTopChips();
      qcard2.appendChild(fb);
      setTimeout(()=>{
        if(!isCorrect && RUN.lives<=0){ handleLivesExhausted(); return; }
        if(isCorrect){
          RUN.mazeGateIdx++; RUN.idx++;
          if(RUN.mazeGateIdx>=Math.floor(gates.length/3)*3 && RUN.mazeGateIdx%3===0) RUN.mazeCheckpoint=RUN.mazeGateIdx;
          if(RUN.mazeGateIdx>=gates.length){ stopTimer(); finishLevel(true); return; }
        } else {
          RUN.mazeGateIdx = RUN.mazeCheckpoint;
        }
        render();
      },1200);
    };
    optsEl.appendChild(b);
  });
}

/* ---- BOSS (mixed parts) ---- */
function renderBossPart(){
  const parts = RUN.level.questions.parts;
  const p = parts[RUN.idx];
  const qcard = document.getElementById('qcard');
  const introBanner = RUN.idx===0 ? `<div class="evidence-box center" style="font-weight:800;">👾 ${RUN.level.id===10?'THE FINAL CHALLENGE':'CHALLENGE BOSS'} — Buktikan seluruh pengetahuanmu!</div>` : '';
  qcard.innerHTML = `${introBanner}<div id="bossInner"></div>`;
  const inner = document.getElementById('bossInner');
  if(p.type==='mc'){
    inner.innerHTML = `<h3>${esc(p.q)}</h3><div id="opts"></div>`;
    const optsEl = document.getElementById('opts');
    p.options.forEach((opt,i)=>{
      const b=document.createElement('button'); b.className='opt-btn'; b.textContent=opt;
      b.onclick=()=>{ document.querySelectorAll('#opts .opt-btn').forEach(x=>x.classList.add('dim')); b.classList.remove('dim'); b.classList.add(i===p.answer?'correct':'wrong'); feedbackThenNext(i===p.answer, p.options[p.answer]); };
      optsEl.appendChild(b);
    });
  } else if(p.type==='tf'){
    inner.innerHTML = `<h3>${esc(p.statement)}</h3><div class="tf-btns"><button class="btn btn-forest" id="tTrue">✅ BENAR</button><button class="btn btn-danger" id="tFalse">❌ SALAH</button></div>`;
    on('tTrue','click',()=>{document.getElementById('tTrue').disabled=true;document.getElementById('tFalse').disabled=true; feedbackThenNext(p.answer===true, p.answer?'BENAR':'SALAH');});
    on('tFalse','click',()=>{document.getElementById('tTrue').disabled=true;document.getElementById('tFalse').disabled=true; feedbackThenNext(p.answer===false, p.answer?'BENAR':'SALAH');});
  } else if(p.type==='riddle'){
    inner.innerHTML = `<h3>🧩 Siapakah Aku?</h3><div class="evidence-box"><ul>${p.clues.map(c=>'<li>'+esc(c)+'</li>').join('')}</ul></div><div id="opts" style="margin-top:14px;"></div>`;
    const optsEl = document.getElementById('opts');
    p.options.forEach((opt,i)=>{
      const b=document.createElement('button'); b.className='opt-btn'; b.textContent=opt;
      b.onclick=()=>{ document.querySelectorAll('#opts .opt-btn').forEach(x=>x.classList.add('dim')); b.classList.remove('dim'); b.classList.add(i===p.answer?'correct':'wrong'); feedbackThenNext(i===p.answer, p.options[p.answer]); };
      optsEl.appendChild(b);
    });
  }
}

/* ---- finish level ---- */
async function finishLevel(reachedEnd){
  const lv = RUN.level;
  const ratio = RUN.total>0 ? RUN.correct/RUN.total : 0;
  const passed = ratio >= (lv.pass||0.6);
  S.lives = 3;
  if(!S.hintsUsedByLevel) S.hintsUsedByLevel={};
  S.hintsUsedByLevel[lv.id] = RUN.usedHint;

  if(passed){
    if(!S.completed.includes(lv.id)) S.completed.push(lv.id);
    if(!S.completed.includes(lv.id)) {} // no-op safeguard
    S.keys = S.completed.length;
    if(lv.id === S.unlockedLevel && S.unlockedLevel < 10) S.unlockedLevel++;
    else if(lv.id >= S.unlockedLevel && S.unlockedLevel<10) S.unlockedLevel = Math.max(S.unlockedLevel, lv.id+1);
    checkAchievements(lv, RUN);
    await saveProgress();
    await saveLeaderboard();
    if(lv.id===10){ SFX.win(); showWinSequence(); return; }
    SFX.key();
    showKeyModal(lv);
  } else {
    SFX.lose();
    await saveProgress();
    showRetryModal(lv, ratio);
  }
}

function checkAchievements(lv, run){
  const add = (id)=>{ if(!S.achievements.includes(id)) S.achievements.push(id); };
  if(lv.id===1) add('first_step');
  if(S.completed.length>=5) add('knowledge_hunter');
  if(lv.type==='riddle' && !run.usedHint) add('puzzle_master');
  if(run.total>0 && run.correct===run.total) add('speed_runner');
  if(lv.id===10) add('master_pengetahuan');
}

async function generateQuestionsFromMateri(){
  const status = document.getElementById('genStatus');
  const judul = document.getElementById('mJudul').value.trim() || C.materi.judul;
  const isi = document.getElementById('mIsi').value.trim() || C.materi.isi;
  const perLevel = parseInt(document.getElementById('mPerLevel').value)||5;
  status.textContent = '⏳ Sedang membuat soal berdasarkan materi… mohon tunggu.';
  const schemaGuide = `
Buatkan soal untuk game edukasi 10 level dengan tingkat kesulitan meningkat, HANYA berdasarkan materi berikut, jangan membuat fakta baru di luar materi.
Level 1: type "mc" (pilihan ganda, 4 opsi)
Level 2: type "sentence" (paragraf pendek dari materi + pertanyaan "temukan kalimat..." + array sentences 3 opsi)
Level 3: type "riddle" (clues array 3 petunjuk bertahap + 4 opsi jawaban)
Level 4: type "scramble" (array kata acak "words" + array "correct" urutan kalimat benar, 5-8 kata)
Level 5: type "matching" (HANYA 1 objek soal berisi array "pairs" masing masing {term,def}, minimal 4 pasangan)
Level 6: type "tf" (statement + answer boolean)
Level 7: type "maze" (HANYA 1 objek soal berisi array "gates" masing masing {q,options(4),answer(index)}, minimal 5 gates)
Level 8: type "detective" (array evidence 3 kalimat + q + 4 options + answer index)
Level 9 & 10: type "boss" (HANYA 1 objek soal berisi array "parts" gabungan beberapa {type:"mc"|"tf"|"riddle", ...field sesuai tipe}, minimal 4 parts, level 10 lebih dramatis dan sulit)

Jumlah soal per level (untuk level bertipe mc/sentence/riddle/scramble/tf/detective, bukan matching/maze/boss): ${perLevel} soal.
Semua teks dalam Bahasa Indonesia, mudah dipahami siswa SMA, tidak mengulang pertanyaan yang sama antar level.

Judul materi: ${judul}
Isi materi:
"""
${isi}
"""

WAJIB balas HANYA dengan JSON valid (tanpa markdown, tanpa penjelasan) dengan struktur:
{"levels":[
 {"id":1,"type":"mc","questions":[{"q":"","options":["","","",""],"answer":0,"hint":""}, ...]},
 {"id":2,"type":"sentence","questions":[{"paragraph":"","q":"","sentences":["","",""],"answer":0,"hint":""}, ...]},
 {"id":3,"type":"riddle","questions":[{"clues":["","",""],"options":["","","",""],"answer":0,"hint":""}, ...]},
 {"id":4,"type":"scramble","questions":[{"words":["",""],"correct":["",""],"hint":""}, ...]},
 {"id":5,"type":"matching","questions":[{"pairs":[{"term":"","def":""}],"hint":""}]},
 {"id":6,"type":"tf","questions":[{"statement":"","answer":true,"hint":""}, ...]},
 {"id":7,"type":"maze","questions":{"gates":[{"q":"","options":["","","",""],"answer":0}],"hint":""}},
 {"id":8,"type":"detective","questions":[{"evidence":["","",""],"q":"","options":["","","",""],"answer":0,"hint":""}, ...]},
 {"id":9,"type":"boss","questions":{"parts":[{"type":"mc","q":"","options":["","","",""],"answer":0}]}},
 {"id":10,"type":"boss","questions":{"parts":[{"type":"mc","q":"","options":["","","",""],"answer":0}]}}
]}`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4000,
        messages: [{ role: "user", content: schemaGuide }]
      })
    });
    const data = await response.json();
    let text = (data.content||[]).map(b=>b.text||'').join('');
    text = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);
    if(!parsed.levels || !Array.isArray(parsed.levels)) throw new Error('format tidak sesuai');
    // merge into existing levels, keep name/icon/diff/time/pass, replace questions
    parsed.levels.forEach(pl=>{
      const target = C.levels.find(l=>l.id===pl.id);
      if(target && pl.questions){ target.questions = pl.questions; if(pl.type) target.type = pl.type; }
    });
    C.materi.judul = judul; C.materi.isi = isi;
    await saveContent();
    status.textContent = '✅ Soal otomatis berhasil dibuat dan disimpan! Cek di menu Bank Soal untuk mengedit.';
  }catch(e){
    console.error(e);
    status.textContent = '⚠️ Gagal membuat soal otomatis ('+(e.message||'error')+'). Soal contoh bawaan tetap dapat digunakan, atau coba lagi.';
  }
}

      if(p.type==='mc') return `<div class="qedit-item"><span class="small-muted">Bagian ${i+1} • MC</span><label class="field-label">Pertanyaan</label><input type="text" data-pk="q" data-pi="${i}" value="${esc(p.q)}">${p.options.map((o,oi)=>`<label class="field-label">Opsi ${oi+1}${oi===p.answer?' ✅':''}</label><input type="text" data-pk="opt" data-pi="${i}" data-oi="${oi}" value="${esc(o)}">`).join('')}</div>`;
      if(p.type==='tf') return `<div class="qedit-item"><span class="small-muted">Bagian ${i+1} • Benar/Salah</span><label class="field-label">Pernyataan</label>${textarea('bstmt_'+i,p.statement)}<label class="field-label">Jawaban: ${p.answer?'BENAR':'SALAH'}</label></div>`;
      if(p.type==='riddle') return `<div class="qedit-item"><span class="small-muted">Bagian ${i+1} • Teka-teki</span><label class="field-label">Petunjuk (pisahkan baris)</label><textarea data-pk="clues" data-pi="${i}" rows="3">${esc((p.clues||[]).join('\\n'))}</textarea>${(p.options||[]).map((o,oi)=>`<label class="field-label">Opsi ${oi+1}${oi===p.answer?' ✅':''}</label><input type="text" data-pk="opt" data-pi="${i}" data-oi="${oi}" value="${esc(o)}">`).join('')}</div>`;
      return '';
    }).join('');
  } else {
    // mc, sentence, riddle, scramble, tf, detective — array of questions
    items.innerHTML = lv.questions.map((q,i)=>{
      if(lv.type==='mc' || lv.type==='detective'){
        const evid = lv.type==='detective' ? `<label class="field-label">Bukti (pisahkan baris)</label><textarea data-k="evidence" data-i="${i}" rows="3">${esc((q.evidence||[]).join('\\n'))}</textarea>` : '';
        return `<div class="qedit-item">${evid}<label class="field-label">Pertanyaan ${i+1}</label><input type="text" data-k="q" data-i="${i}" value="${esc(q.q)}">
          ${q.options.map((o,oi)=>`<label class="field-label">Opsi ${oi+1}${oi===q.answer?' ✅ Benar':''}</label><input type="text" data-k="opt" data-i="${i}" data-oi="${oi}" value="${esc(o)}">`).join('')}
          <label class="field-label">Hint</label><input type="text" data-k="hint" data-i="${i}" value="${esc(q.hint||'')}">
        </div>`;
      }
      if(lv.type==='sentence'){
        return `<div class="qedit-item"><label class="field-label">Paragraf</label><textarea data-k="paragraph" data-i="${i}" rows="3">${esc(q.paragraph)}</textarea>
        <label class="field-label">Pertanyaan</label><input type="text" data-k="q" data-i="${i}" value="${esc(q.q)}">
        ${q.sentences.map((s,si)=>`<label class="field-label">Kalimat ${si+1}${si===q.answer?' ✅':''}</label><textarea data-k="sent" data-i="${i}" data-oi="${si}" rows="2">${esc(s)}</textarea>`).join('')}</div>`;
      }
      if(lv.type==='riddle'){
        return `<div class="qedit-item"><label class="field-label">Petunjuk (pisahkan baris)</label><textarea data-k="clues" data-i="${i}" rows="3">${esc(q.clues.join('\\n'))}</textarea>
        ${q.options.map((o,oi)=>`<label class="field-label">Opsi ${oi+1}${oi===q.answer?' ✅':''}</label><input type="text" data-k="opt" data-i="${i}" data-oi="${oi}" value="${esc(o)}">`).join('')}</div>`;
      }
      if(lv.type==='scramble'){
        return `<div class="qedit-item"><label class="field-label">Kalimat Jawaban Benar (pisahkan spasi)</label><input type="text" data-k="correct" data-i="${i}" value="${esc(q.correct.join(' '))}"></div>`;
      }
      if(lv.type==='tf'){
        return `<div class="qedit-item"><label class="field-label">Pernyataan ${i+1}</label><textarea data-k="statement" data-i="${i}" rows="2">${esc(q.statement)}</textarea>
        <label class="field-label">Jawaban</label><select data-k="tfans" data-i="${i}"><option value="true" ${q.answer?'selected':''}>BENAR</option><option value="false" ${!q.answer?'selected':''}>SALAH</option></select></div>`;
      }
      return '';
    }).join('');
  }

  on('saveBank','click', async ()=>{
    if(lv.type==='matching'){
      const pairs = lv.questions[0].pairs;
      document.querySelectorAll('[data-k="term"]').forEach(inp=>{ pairs[inp.dataset.i].term = inp.value; });
      pairs.forEach((p,i)=>{ const t=document.getElementById('def_'+i); if(t) p.def=t.value; });
    } else if(lv.type==='maze'){
      const gates = lv.questions.gates;
      document.querySelectorAll('[data-gk="q"]').forEach(inp=>{ gates[inp.dataset.gi].q = inp.value; });
      document.querySelectorAll('[data-gk="opt"]').forEach(inp=>{ gates[inp.dataset.gi].options[inp.dataset.oi] = inp.value; });
    } else if(lv.type==='boss'){
      const parts = lv.questions.parts;
      document.querySelectorAll('[data-pk="q"]').forEach(inp=>{ parts[inp.dataset.pi].q = inp.value; });
      document.querySelectorAll('[data-pk="opt"]').forEach(inp=>{ parts[inp.dataset.pi].options[inp.dataset.oi] = inp.value; });
      parts.forEach((p,i)=>{ const t=document.getElementById('bstmt_'+i); if(t) p.statement=t.value; });
      document.querySelectorAll('[data-pk="clues"]').forEach(inp=>{ parts[inp.dataset.pi].clues = inp.value.split('\\n').filter(Boolean); });
    } else {
      document.querySelectorAll('[data-k="q"]').forEach(inp=>{ lv.questions[inp.dataset.i].q = inp.value; });
      document.querySelectorAll('[data-k="opt"]').forEach(inp=>{ lv.questions[inp.dataset.i].options[inp.dataset.oi] = inp.value; });
      document.querySelectorAll('[data-k="hint"]').forEach(inp=>{ lv.questions[inp.dataset.i].hint = inp.value; });
      document.querySelectorAll('[data-k="paragraph"]').forEach(inp=>{ lv.questions[inp.dataset.i].paragraph = inp.value; });
      document.querySelectorAll('[data-k="sent"]').forEach(inp=>{ lv.questions[inp.dataset.i].sentences[inp.dataset.oi] = inp.value; });
      document.querySelectorAll('[data-k="clues"]').forEach(inp=>{ lv.questions[inp.dataset.i].clues = inp.value.split('\\n').filter(Boolean); });
      document.querySelectorAll('[data-k="correct"]').forEach(inp=>{ lv.questions[inp.dataset.i].correct = inp.value.trim().split(/\\s+/); });
      document.querySelectorAll('[data-k="statement"]').forEach(inp=>{ lv.questions[inp.dataset.i].statement = inp.value; });
      document.querySelectorAll('[data-k="tfans"]').forEach(sel2=>{ lv.questions[sel2.dataset.i].answer = sel2.value==='true'; });
      document.querySelectorAll('[data-k="evidence"]').forEach(inp=>{ lv.questions[inp.dataset.i].evidence = inp.value.split('\\n').filter(Boolean); });
    }
    await saveContent();
    alert('Perubahan soal Level '+lv.id+' berhasil disimpan.');
  });
}

async function renderTeachSiswa(body){
  body.innerHTML = `<p class="small-muted">Memuat hasil siswa…</p>`;
  let keys = [];
  try{ keys = await sList('leaderboard:', true); }catch(e){ keys=[]; }
  if(!keys.length){ body.innerHTML = `<p>Belum ada data siswa yang menyelesaikan level. Data akan muncul setelah siswa bermain.</p>`; return; }
  const rows = [];
  for(const k of keys){
    const d = await sGet(k, true);
    if(d) rows.push(d);
  }
  rows.sort((a,b)=>b.score-a.score);
  body.innerHTML = `<table class="data"><thead><tr><th>Nama</th><th>Kelas</th><th>Level Selesai</th><th>Kunci</th><th>Skor</th></tr></thead>
   <tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.kelas||'-')}</td><td>${r.levelsCompleted}/10</td><td>${r.keys}/10</td><td class="mono">${r.score}</td></tr>`).join('')}</tbody></table>`;
}

function renderTeachSettings(body){
  body.innerHTML = `
   <p class="small-muted">Pengaturan tampil di sini bersifat contoh dasar; poin/nyawa/hint dapat disesuaikan langsung pada soal atau kode jika diperlukan penyesuaian lanjutan.</p>
   <div class="row" style="margin-top:10px;">
    <div style="flex:1;min-width:160px;"><label class="field-label">Jawaban Benar</label><input type="text" value="+100 poin" disabled></div>
    <div style="flex:1;min-width:160px;"><label class="field-label">Jawaban Salah</label><input type="text" value="-1 ❤️ Nyawa" disabled></div>
    <div style="flex:1;min-width:160px;"><label class="field-label">Gunakan Hint</label><input type="text" value="-10 poin" disabled></div>
   </div>
   <div style="height:18px;"></div>
   <h3 style="margin:0 0 10px;">🎓 Data untuk Sertifikat Kelulusan</h3>
   <label class="field-label">Nama Guru Pengampu</label>
   <input type="text" id="teacherNameInput" value="${esc(C.teacherName||'')}">
   <div style="height:10px;"></div>
   <label class="field-label">Nama Sekolah</label>
   <input type="text" id="schoolInput" value="${esc(C.school||'')}">
   <div style="height:14px;"></div>
   <button class="btn btn-mystic btn-sm" id="saveCertInfo">💾 Simpan Data Sertifikat</button>
   <div style="height:18px;"></div>
   <button class="btn btn-danger" id="resetContent">🗑️ Kembalikan Materi & Soal ke Contoh Bawaan</button>
  `;
  on('saveCertInfo','click', async ()=>{
    C.teacherName = document.getElementById('teacherNameInput').value.trim();
    C.school = document.getElementById('schoolInput').value.trim();
    await saveContent();
    showToast('Data sertifikat berhasil disimpan.');
  });
  on('resetContent','click', async ()=>{
    if(confirm('Kembalikan materi dan seluruh soal ke data contoh bawaan?')){
      C = { materi: DEFAULT_MATERI, levels: defaultLevels(), teacherName: C.teacherName, school: C.school };
      await saveContent();
      alert('Materi & soal dikembalikan ke contoh bawaan.');
      render();
    }
  });
}
